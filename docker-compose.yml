services:
  db:
    image: mariadb:10.4
    container_name: manga_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: manga_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./manga_db.sql:/docker-entrypoint-initdb.d/01_manga_db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: manga_web
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./public/uploads:/app/public/uploads
    environment:
      - DATABASE_URL=mysql://root:rootpassword@db:3306/manga_db
      - DATABASE_HOST=db
      - DATABASE_USER=root
      - DATABASE_PASSWORD=rootpassword
      - DATABASE_NAME=manga_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
